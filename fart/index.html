<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- page:start -->
<title>Fart Machine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- pwa:start -->
<meta name="theme-color" content="#F3C33A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fart Machine">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- pwa:end -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Barlow+Semi+Condensed:wght@500;700&family=VT323&display=swap">
<style>
  /* Layout: one toy-panel column, the whoopee cushion on top, an LCD readout, then the preset keys */
  :root {
    --mustard: #F3C33A;
    --mustard-deep: #E0AC22;
    --ink: #2A1530;
    --rubber: #E0365A;
    --rubber-dark: #9E1C3C;
    --cream: #FFF4D8;
    --gas: #9BC53D;
    --lcd: #B8C788;
    --lcd-ink: #26301A;
    --display: "Bagel Fat One", "Arial Black", Impact, system-ui, sans-serif;
    --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
    --digits: "VT323", ui-monospace, "Courier New", monospace;
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background-color: var(--mustard);
    background-image: radial-gradient(var(--mustard-deep) 1.5px, transparent 1.6px);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .machine {
    box-sizing: border-box;
    max-width: 460px;
    margin: 0 auto;
    min-height: 100%;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  header { text-align: center; }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.6rem, 13vw, 3.6rem);
    line-height: .9;
    color: var(--rubber);
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 4px 0 var(--ink);
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .tagline {
    margin: 10px 0 0;
    font-weight: 700;
    font-size: .8rem;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  /* The big random button: a whoopee cushion */
  .stage { position: relative; display: grid; place-items: center; }
  .cushion {
    position: relative;
    width: min(78vw, 300px);
    aspect-ratio: 240 / 200;
    max-width: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    transform-origin: 50% 85%;
    touch-action: manipulation;
  }
  .cushion svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .cushion-label {
    position: absolute;
    left: 0; right: 0; top: 38%;
    transform: translateY(-50%);
    font-family: var(--display);
    font-size: clamp(1.7rem, 9vw, 2.3rem);
    color: var(--cream);
    -webkit-text-stroke: 1.5px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 3px 0 var(--ink);
    pointer-events: none;
  }
  .cushion:focus-visible { outline: 4px dashed var(--ink); outline-offset: 6px; border-radius: 40%; }
  .cushion.squish { animation: squish .42s cubic-bezier(.3, 1.6, .5, 1); }
  .cushion.rumble svg { animation: rumble .09s linear infinite; }
  @keyframes squish {
    0% { transform: scale(1, 1); }
    30% { transform: scale(1.12, .78); }
    100% { transform: scale(1, 1); }
  }
  @keyframes rumble {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-1.5px, 1px); }
    75% { transform: translate(1.5px, -1px); }
  }
  .puff {
    position: absolute;
    left: 50%; bottom: 4%;
    width: 46px; height: 46px;
    margin-left: -23px;
    border-radius: 50%;
    background: var(--gas);
    opacity: 0;
    pointer-events: none;
    filter: blur(1px);
    animation: puff 1.3s ease-out forwards;
  }
  @keyframes puff {
    0% { opacity: .85; transform: translate(0, 0) scale(.3); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(var(--s)); }
  }

  /* LCD readout */
  .lcd {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 8px 14px;
    background: var(--lcd);
    color: var(--lcd-ink);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: inset 0 3px 0 rgba(0, 0, 0, .12);
    font-family: var(--digits);
    font-size: 1.35rem;
    line-height: 1.1;
    text-transform: uppercase;
  }
  .lcd-main { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lcd-count { flex: none; font-variant-numeric: tabular-nums; }

  /* Preset keys */
  .presets { display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 0; list-style: none; }
  .key {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: var(--cream);
    color: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .06s, box-shadow .06s, background-color .1s, color .1s;
  }
  .key:active, .key.pressed { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .key.on { background: var(--rubber); color: var(--cream); }
  .key:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }
  .key-name { font-family: var(--display); font-size: 1.35rem; line-height: 1.1; min-width: 0; }
  .key-spec {
    flex: none;
    font-family: var(--digits);
    font-size: 1.2rem;
    opacity: .75;
    font-variant-numeric: tabular-nums;
  }
  .key.on .key-spec { opacity: 1; }

  .fineprint {
    margin: 0;
    text-align: center;
    font-size: .8rem;
    font-weight: 500;
    letter-spacing: .04em;
    opacity: .75;
  }

  @media (prefers-reduced-motion: reduce) {
    .cushion.squish, .cushion.rumble svg, .puff { animation: none; }
    .puff { display: none; }
  }
</style>
<!-- page:end -->
</head>
<body>
<!-- body:start -->
<main class="machine">
  <header>
    <h1>Fart Machine</h1>
    <p class="tagline">5 presets · 1 random · no batteries</p>
  </header>

  <div class="stage" id="stage">
    <button class="cushion" id="random" type="button" aria-label="Random fart">
      <svg viewBox="0 0 240 200" aria-hidden="true">
        <path d="M100 150 L140 150 L150 190 Q120 200 90 190 Z" fill="#E0365A" stroke="#2A1530" stroke-width="6" stroke-linejoin="round"/>
        <path d="M95 182 Q120 190 145 182" fill="none" stroke="#9E1C3C" stroke-width="4" stroke-linecap="round"/>
        <ellipse cx="120" cy="88" rx="108" ry="80" fill="#E0365A" stroke="#2A1530" stroke-width="6"/>
        <ellipse cx="120" cy="88" rx="88" ry="62" fill="none" stroke="#9E1C3C" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
        <ellipse cx="74" cy="46" rx="30" ry="12" fill="#FFF4D8" opacity=".45" transform="rotate(-22 74 46)"/>
      </svg>
      <span class="cushion-label">Random</span>
    </button>
  </div>

  <div class="lcd" role="status" aria-live="polite">
    <span class="lcd-main" id="readout">Ready. Press anything.</span>
    <span class="lcd-count" id="count">000</span>
  </div>

  <ul class="presets" id="presets"></ul>

  <p class="fineprint">Real recordings. The random button bends the pitch, so no two presses match. Turn your volume up.</p>
</main>

<script>
(() => {
  // Real recordings, trimmed and levelled (see sounds/CREDITS.md).
  const PRESETS = [
    { name: 'The Classic', file: 'classic' },
    { name: 'The Squeaker', file: 'squeaker' },
    { name: 'The Wet One', file: 'wet' },
    { name: 'The Thunder', file: 'thunder' },
    { name: 'The Long Haul', file: 'long-haul' },
  ];
  // Only the random button plays these.
  const EXTRAS = ['toot', 'dry', 'poop-toot', 'blat'];
  const ALL = [...PRESETS.map(p => p.file), ...EXTRAS];

  const ADJ = ['Mystery', 'Rogue', 'Sneaky', 'Bashful', 'Grand', 'Tiny', 'Haunted', 'Elevator', 'Sunday', 'Office', 'Polite', 'Majestic'];
  const NOUN = ['Toot', 'Rumbler', 'Trumpet', 'Squonk', 'Bubbler', 'Honker', 'Blurt', 'Whistle', 'Flapper', 'Tuba', 'Foghorn', 'Kazoo'];

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = list => list[Math.floor(Math.random() * list.length)];

  // iOS: play through the ringer switch like a video would.
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  const decode = data => new Promise((ok, fail) => ctx.decodeAudioData(data, ok, fail));
  const buffers = {};
  ALL.forEach(name => {
    buffers[name] = fetch(`sounds/${name}.mp3`)
      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then(decode);
  });

  // Screen bits
  const $ = id => document.getElementById(id);
  const cushion = $('random'), stage = $('stage'), readout = $('readout'), countEl = $('count');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let toots = 0;
  try { toots = parseInt(localStorage.getItem('fart-machine-toots'), 10) || 0; } catch (e) {}
  const showCount = () => { countEl.textContent = String(Math.min(toots, 999)).padStart(3, '0'); };
  showCount();

  function puffs(len) {
    if (reduceMotion) return;
    const count = Math.round(4 + Math.min(len, 3) * 3);
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'puff';
      el.style.setProperty('--dx', `${rand(-130, 130)}px`);
      el.style.setProperty('--dy', `${rand(-40, 70)}px`);
      el.style.setProperty('--s', rand(1.2, 2.6).toFixed(2));
      el.style.animationDelay = `${(i / count) * Math.min(len, 2.5)}s`;
      el.addEventListener('animationend', () => el.remove());
      stage.appendChild(el);
    }
  }

  let rumbleTimer;
  async function fart(name, file, rate, key) {
    if (ctx.state === 'suspended') ctx.resume();
    let buf;
    try { buf = await buffers[file]; } catch (e) {
      readout.textContent = 'Sounds did not load. Check your connection.';
      return;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate;
    src.connect(ctx.destination);
    src.start();
    const len = buf.duration / rate;

    readout.textContent = `${name} ${len.toFixed(2)}s`;
    toots++;
    showCount();
    try { localStorage.setItem('fart-machine-toots', toots); } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(Math.min(len * 1000, 1500)); } catch (e) {}

    cushion.classList.remove('squish');
    void cushion.offsetWidth;
    cushion.classList.add('squish', 'rumble');
    clearTimeout(rumbleTimer);
    rumbleTimer = setTimeout(() => cushion.classList.remove('rumble'), len * 1000);
    puffs(len);

    if (key) {
      key.classList.add('on');
      clearTimeout(key._t);
      key._t = setTimeout(() => key.classList.remove('on'), len * 1000);
    }
  }

  // Random: any of the nine recordings, sped up or slowed down a little so no two presses match.
  cushion.addEventListener('click', () => fart(`${pick(ADJ)} ${pick(NOUN)}`, pick(ALL), rand(.8, 1.25), null));

  const list = $('presets');
  PRESETS.forEach(({ name, file }) => {
    const li = document.createElement('li');
    const key = document.createElement('button');
    key.type = 'button';
    key.className = 'key';
    key.innerHTML = `<span class="key-name"></span><span class="key-spec">…</span>`;
    key.querySelector('.key-name').textContent = name;
    buffers[file].then(buf => { key.querySelector('.key-spec').textContent = `${buf.duration.toFixed(1)}s`; }, () => {});
    key.addEventListener('click', () => fart(name, file, 1, key));
    li.appendChild(key);
    list.appendChild(li);
  });

  // Keyboard: 1-5 for presets, R for random.
  document.addEventListener('keydown', e => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const keys = list.querySelectorAll('.key');
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= keys.length) keys[n - 1].click();
    else if (e.key === 'r' || e.key === 'R') cushion.click();
  });

  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
})();
</script>
<!-- body:end -->
</body>
</html>
