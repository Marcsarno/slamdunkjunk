<title>Graveyard Shift: Midnight Golf</title>
<style>:root { color-scheme: dark; background: #170d24; } html, body { height: 100%; }</style>
<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #170d24;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		<div id="diag" style="position:fixed;left:8px;right:8px;bottom:8px;z-index:9;font:13px/1.4 system-ui,sans-serif;color:#f3e6ff;background:rgba(23,13,36,.92);border:1px solid #6b4a8a;border-radius:8px;padding:8px 10px;white-space:pre-wrap;pointer-events:none"></div>
<script>
(function () {
  const box = document.getElementById('diag');
  const line = (t) => { box.textContent += (box.textContent ? '\n' : '') + t; };
  window.__diag = line;
  window.addEventListener('error', (e) => line('Error: ' + (e.message || e.type) + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '')));
  window.addEventListener('unhandledrejection', (e) => line('Error: ' + (e.reason && e.reason.message || e.reason)));
  line('Checking this browser...');
  try {
    const gl = document.createElement('canvas').getContext('webgl2');
    line('WebGL 2: ' + (gl ? 'yes' : 'NO (the game needs it)'));
  } catch (e) { line('WebGL 2: error ' + e.message); }
  line('Unzip (DecompressionStream): ' + (typeof DecompressionStream === 'function' ? 'yes' : 'NO'));
  if (typeof WebAssembly !== 'object') line('WebAssembly: NO (the game engine needs it)');
  else WebAssembly.instantiate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]))
    .then(() => line('WebAssembly: yes'), (e) => line('WebAssembly: BLOCKED - ' + e.message));
  fetch('index.pck.1.wasm', { method: 'HEAD' }).then((r) => line('Game files reachable: ' + (r.ok ? 'yes' : 'NO (' + r.status + ')')),
    (e) => line('Game files reachable: NO - ' + e.message));
}());
</script>
<script>
// Phones report 3x pixel density; drawing the 3D scene at that every frame costs more than it shows.
// Godot sizes its canvas from devicePixelRatio, so it sees at most 2.
(function () {
  const real = window.devicePixelRatio || 1;
  try { Object.defineProperty(window, 'devicePixelRatio', { get: () => Math.min(2, real), configurable: true }); } catch (e) {}
}());
// Godot asks for index.wasm and index.pck; they are hosted gzipped / in parts (see golf/tools/web_pack.py)
(function () {
  const PLAN = {"index.wasm": {"parts": ["index.wasm.gz.0.wasm"], "gzip": true, "type": "application/wasm"}, "index.pck": {"parts": ["index.pck.0.wasm", "index.pck.1.wasm"], "gzip": false, "type": "application/octet-stream"}};
  const realFetch = window.fetch.bind(window);
  function joined(urls) {
    return new ReadableStream({
      async start(ctrl) {
        try {
          for (const u of urls) {
            const r = await realFetch(u);
            if (!r.ok) throw new Error(u + ': ' + r.status);
            const rd = r.body.getReader();
            for (;;) { const { done, value } = await rd.read(); if (done) break; ctrl.enqueue(value); }
          }
          ctrl.close();
        } catch (e) { ctrl.error(e); }
      },
    });
  }
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    const name = url.split('?')[0].split('#')[0].split('/').pop();
    const p = PLAN[name];
    if (!p) return realFetch(input, init);
    let body = joined(p.parts);
    if (p.gzip) body = body.pipeThrough(new DecompressionStream('gzip'));
    return Promise.resolve(new Response(body, { status: 200, headers: { 'Content-Type': p.type } }));
  };
}());
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":24842236,"index.wasm":38057390},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden'); document.getElementById('diag').remove();
		}, (e) => { window.__diag('Engine failed: ' + (e && e.message || e)); displayFailureNotice(e); });
	}
}());
		</script>
